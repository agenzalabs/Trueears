version: 2

# Strategy:
# - patch + minor updates are grouped into a single PR per ecosystem/directory
#   to cut routine churn (one PR instead of a dozen).
# - MAJOR updates are ignored. They carry breaking changes (especially for the
#   payment-service and auth-server crates) and must be upgraded deliberately,
#   with testing, when we choose to — not auto-raised one PR at a time. Bump a
#   major manually and remove its ignore entry if/when we adopt it.
updates:
  # --- Frontend (npm, repo root) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # --- Tauri backend (cargo) ---
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # --- Payment service (cargo) ---
  - package-ecosystem: "cargo"
    directory: "/payment-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # --- Auth server (cargo) ---
  - package-ecosystem: "cargo"
    directory: "/auth-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
