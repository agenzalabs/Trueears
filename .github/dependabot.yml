version: 2

# Strategy:
# - patch + minor updates are grouped into a single PR per ecosystem/directory
#   to cut routine churn (one PR instead of a dozen).
# - MAJOR updates are ignored. They carry breaking changes (especially for the
#   payment-service and auth-server crates) and must be upgraded deliberately,
#   with testing, when we choose to — not auto-raised one PR at a time. Bump a
#   major manually and remove its ignore entry if/when we adopt it.
updates:
  # --- Frontend (npm, repo root) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The @tauri-apps npm packages must stay on the same major.minor as the
      # Rust `tauri` crate (2.9.x) or the Tauri CLI aborts the build with a
      # "version mismatched Tauri packages" error. Upgrade them together with
      # the Rust crate, deliberately — not via a drive-by minor bump.
      - dependency-name: "@tauri-apps/api"
      - dependency-name: "@tauri-apps/cli"

  # --- Tauri backend (cargo) ---
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The whole Tauri stack must move together, deliberately. Pin the Rust
      # `tauri`/`tauri-build` crates to 2.9.x so a minor bump can't push them
      # ahead of the npm @tauri-apps packages (which are frozen at 2.9 in the
      # npm block) — that mismatch aborts the build. The runtime crates
      # (wry/tauri-runtime/tauri-runtime-wry) and webview2-com are coupled too
      # and resolve from whatever `tauri` requires. Upgrade as one unit.
      - dependency-name: "tauri"
      - dependency-name: "tauri-build"
      - dependency-name: "wry"
      - dependency-name: "tauri-runtime"
      - dependency-name: "tauri-runtime-wry"
      - dependency-name: "webview2-com"
      # The tauri-plugin-* crates and webkit2gtk are part of the same stack:
      # bumping a plugin minor transitively drags tauri-runtime-wry ahead of the
      # pinned tauri 2.9, which breaks the build (missing `eval_script_with_callback`).
      # Freeze them too; they move with the deliberate Tauri upgrade.
      - dependency-name: "tauri-plugin-*"
      - dependency-name: "webkit2gtk"

  # --- Payment service (cargo) ---
  - package-ecosystem: "cargo"
    directory: "/payment-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # --- Auth server (cargo) ---
  - package-ecosystem: "cargo"
    directory: "/auth-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
