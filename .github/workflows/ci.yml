name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run vite:build

  backend-check:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Compile check backend
        run: cargo check --manifest-path backend/Cargo.toml

      - name: Run backend tests
        run: cargo test --manifest-path backend/Cargo.toml

  windows-tauri-build-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # The bundle produces signed updater artifacts, so both halves of a keypair
      # must be present: the private key to sign with, and a matching public key
      # in tauri.conf.json (the bundler validates it and fails on a placeholder).
      #
      # A throwaway pair is generated here on purpose. The smoke build's output is
      # discarded, and pull requests from forks cannot read repository secrets, so
      # this keeps the job self-contained. Real releases are signed with the actual
      # key in release.yml. The config edit stays in the workspace and is never
      # committed.
      #
      # The password must be non-empty: an empty one is rejected as incorrect, and
      # an empty TAURI_SIGNING_PRIVATE_KEY_PASSWORD makes the tooling fall back to
      # an interactive prompt, which would hang the job instead of failing it.
      - name: Generate throwaway updater signing key
        shell: bash
        run: |
          npm run tauri -- signer generate -w "$RUNNER_TEMP/ci-updater.key" --password "ci-smoke-build"
          node -e "
            const fs = require('fs');
            const conf = 'backend/tauri.conf.json';
            const json = JSON.parse(fs.readFileSync(conf, 'utf8'));
            json.plugins.updater.pubkey = fs.readFileSync(process.argv[1], 'utf8').trim();
            fs.writeFileSync(conf, JSON.stringify(json, null, 2) + '\n');
          " "$RUNNER_TEMP/ci-updater.key.pub"
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/ci-updater.key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=ci-smoke-build" >> "$GITHUB_ENV"

      - name: Build Windows app smoke
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint frontend/src

  rust-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev

      - name: Check Rust formatting
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: NPM security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo security audit
        run: cargo install cargo-audit && cargo audit --file backend/Cargo.toml
        continue-on-error: true

  payment-service-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install OpenSSL (native-tls)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Check formatting
        run: cargo fmt --manifest-path payment-service/Cargo.toml -- --check

      - name: Run tests
        run: cargo test --manifest-path payment-service/Cargo.toml

      # Clippy is reported but non-fatal: the crate carries pre-existing dead-code
      # warnings outside this change's scope. Tighten to `-D warnings` after a
      # dedicated dead-code cleanup pass.
      - name: Clippy
        run: cargo clippy --manifest-path payment-service/Cargo.toml
        continue-on-error: true
