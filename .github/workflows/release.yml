name: Release

on:
  push:
    branches:
      - main

jobs:
  # First, check if a release is needed (version not already tagged)
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      previous_tag: ${{ steps.changelog.outputs.previous_tag }}
      should_release: ${{ steps.check_tag.outputs.should_release }}
      release_body: ${{ steps.changelog.outputs.release_body }}
      update_notes: ${{ steps.changelog.outputs.update_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG does not exist — proceeding with release"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        if: steps.check_tag.outputs.should_release == 'true'
        id: changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          
          # Fetch the latest stable release tag using GitHub CLI
          PREV_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            echo "Generating changelog from $PREV_TAG to HEAD"
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          else
            RANGE="HEAD"
            echo "No previous tag found — using full history"
            COMPARE_URL=""
          fi

          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT

          # Collect commits by category using conventional commit prefixes
          FEATURES=$(git log "$RANGE" --no-merges --format="- %s" --grep="^feat([(:]|$)" --extended-regexp --regexp-ignore-case 2>/dev/null || true)
          FIXES=$(git log "$RANGE" --no-merges --format="- %s" --grep="^fix([(:]|$)" --extended-regexp --regexp-ignore-case 2>/dev/null || true)
          REFACTORS=$(git log "$RANGE" --no-merges --format="- %s" --grep="^refactor([(:]|$)" --extended-regexp --regexp-ignore-case 2>/dev/null || true)
          CHORES=$(git log "$RANGE" --no-merges --format="- %s" --grep="^(chore|docs|ci|build)([(:]|$)" --extended-regexp --regexp-ignore-case 2>/dev/null || true)
          # Catch commits that don't follow conventional commits
          OTHER=$(git log "$RANGE" --no-merges --format="- %s" --invert-grep --grep="^(feat|fix|refactor|chore|docs|ci|build)([(:]|$)" --extended-regexp --regexp-ignore-case 2>/dev/null || true)

          # Build the changelog body
          BODY=""

          if [ -n "$FEATURES" ]; then
            BODY="${BODY}### New Features\n${FEATURES}\n\n"
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}### Bug Fixes\n${FIXES}\n\n"
          fi
          if [ -n "$REFACTORS" ]; then
            BODY="${BODY}### Refactoring\n${REFACTORS}\n\n"
          fi
          if [ -n "$OTHER" ]; then
            BODY="${BODY}### Other Changes\n${OTHER}\n\n"
          fi
          if [ -n "$CHORES" ]; then
            BODY="${BODY}### Maintenance\n${CHORES}\n\n"
          fi

          if [ -z "$BODY" ]; then
            BODY="No notable changes since last release.\n"
          fi

          # Build the final GitHub release body and write it as a multiline output.
          {
            echo "release_body<<RELEASE_BODY_EOF"
            printf '## Trueears %s\n\n' "$TAG"
            printf 'Auto-generated release from merge to `main`.\n\n'
            printf '### Installation\n\n'
            printf '%s\n' '- **Windows (.exe)**: NSIS installer'
            printf '\n%s\n' 'Linux and macOS artifacts remain in CI only during the Phase 1 Windows-first hardening pass.'
            printf '\n### Changelog\n\n'
            printf '%b' "$BODY"
            if [ -n "$COMPARE_URL" ]; then
              printf '\n[Full Changelog](%s)\n' "$COMPARE_URL"
            fi
            echo "RELEASE_BODY_EOF"
          } >> $GITHUB_OUTPUT

          # Separate, user-facing notes for the in-app update prompt.
          #
          # The release body above is written for the GitHub release page: it is
          # markdown, and it carries install instructions and a changelog link
          # that mean nothing inside the app. The updater shows `notes` as plain
          # text, so markdown syntax would appear literally. Build a short plain
          # text summary instead, with the conventional-commit prefixes stripped.
          strip_prefix() {
            sed -E 's/^[a-zA-Z]+(\([^)]*\))?!?: *//' | sed -E 's/^(.)/\u\1/' | sed 's/^/• /' | head -n 8
          }

          FEATURES_PLAIN=$(git log "$RANGE" --no-merges --format="%s" --grep="^feat([(:]|$)" --extended-regexp --regexp-ignore-case 2>/dev/null | strip_prefix || true)
          FIXES_PLAIN=$(git log "$RANGE" --no-merges --format="%s" --grep="^fix([(:]|$)" --extended-regexp --regexp-ignore-case 2>/dev/null | strip_prefix || true)

          {
            echo "update_notes<<UPDATE_NOTES_EOF"
            if [ -n "$FEATURES_PLAIN" ]; then
              echo "What's new"
              echo "$FEATURES_PLAIN"
              [ -n "$FIXES_PLAIN" ] && echo
            fi
            if [ -n "$FIXES_PLAIN" ]; then
              echo "Fixes"
              echo "$FIXES_PLAIN"
            fi
            if [ -z "$FEATURES_PLAIN" ] && [ -z "$FIXES_PLAIN" ]; then
              echo "Maintenance and stability improvements."
            fi
            echo "UPDATE_NOTES_EOF"
          } >> $GITHUB_OUTPUT

  # Build and release for each platform
  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './backend -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and uploads latest.json alongside the
          # installer. Without these the release build fails, and installed apps
          # would reject the update as unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ needs.check-version.outputs.tag }}
          releaseName: 'Trueears ${{ needs.check-version.outputs.tag }}'
          releaseBody: ${{ needs.check-version.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          projectPath: './backend'

      # tauri-action copies the GitHub release body into latest.json's `notes`,
      # which is what the in-app prompt displays. Swap in the plain text summary
      # so users see a readable changelog instead of raw markdown and install
      # instructions. Patching the published manifest rather than the app means
      # already-installed builds get the cleaner text too.
      - name: Replace updater notes with the user-facing summary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
          UPDATE_NOTES: ${{ needs.check-version.outputs.update_notes }}
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/updater-notes"
          mkdir -p "$WORK"

          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$WORK"; then
            echo "::warning::latest.json not found on $TAG - skipping notes rewrite"
            exit 0
          fi

          node -e "
            const fs = require('fs');
            const path = process.argv[1];
            const notes = process.env.UPDATE_NOTES || '';
            if (!notes.trim()) {
              console.log('No update notes produced - leaving latest.json untouched');
              process.exit(0);
            }
            const json = JSON.parse(fs.readFileSync(path, 'utf8'));
            json.notes = notes.trim();
            fs.writeFileSync(path, JSON.stringify(json, null, 2));
            console.log('Updater notes set to:\n' + json.notes);
          " "$WORK/latest.json"

          gh release upload "$TAG" "$WORK/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
